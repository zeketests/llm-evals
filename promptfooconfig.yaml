description: First Eval

prompts:
  - "Provide the capital of {{country}} in one word"

providers:
  - ollama:chat:qwen2.5:7b

tests:
  - vars:
      country: Argentina
    assert:
      - type: icontains-any
        value: ["Buenos Aires", "Capital Federal"]

  - vars:
      country: France
    assert:
      - type: icontains-any
        value: ["Paris", "París"]      

  - vars:
      country: Japan
    assert:
      - type: icontains-any
        value: ["Tokyo", "Tōkyō"]        
  - vars:
      country: Korea
    assert:
      - type: icontains-any
        value: ["Seoul"]     

